<!doctype html>

<svg id="fig" xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440">

      <path d="M0,0 L10,5 L0,10 z" fill="#C62828"/>

  <rect x="350" y="192" width="280" height="56" rx="10" fill="#0B4F6C"/>

  <g text-anchor="middle">
    <text x="490" y="38" font-size="14.5" font-weight="700" fill="#0B4F6C">Gouvernance : politiques, sensibilisation, audit</text>
    <text x="490" y="86" font-size="14.5" font-weight="700" fill="#0B4F6C">Identité et accès : IAM, MFA, PAM, moindre privilège</text>

    <text x="490" y="237" font-size="12" fill="#CDE8F2">chiffrement, classification, DLP, sauvegardes</text>
  </g>

  <g>
    <circle cx="62" cy="220" r="18" fill="#FDECEA" stroke="#C62828" stroke-width="1.8"/>

    <text x="62" y="260" text-anchor="middle" font-size="13" font-weight="700" fill="#C62828">Attaquant</text>

  <text x="900" y="200" text-anchor="middle" font-size="12.5" fill="#33414A">Chaque couche</text>
  <text x="900" y="218" text-anchor="middle" font-size="12.5" fill="#33414A">ralentit l'attaquant</text>
  <text x="900" y="236" text-anchor="middle" font-size="12.5" fill="#33414A">et permet de</text>
  <text x="900" y="254" text-anchor="middle" font-size="12.5" fill="#33414A">le détecter</text>
