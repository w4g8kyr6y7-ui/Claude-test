<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff}
svg text{font-family:Inter,'Liberation Sans',sans-serif}
</style></head><body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1F2D36"/>
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fff" stroke="#1F2D36" stroke-width="1.2"/>
    </marker>
    <marker id="circ" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7">
      <circle cx="5" cy="5" r="4" fill="#fff" stroke="#1F2D36" stroke-width="1.2"/>
    </marker>
    <marker id="thin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1F2D36" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#fff"/>

  <!-- column headers -->
  <g font-size="15" font-weight="700" fill="#0B4F6C">
    <text x="20" y="28">Événements</text>
    <text x="262" y="28">Activités</text>
    <text x="494" y="28">Passerelles</text>
    <text x="724" y="28">Connecteurs</text>
    <text x="20" y="352">Piscine et couloirs</text>
    <text x="560" y="352">Objets</text>
  </g>
  <g stroke="#CFDDE4" stroke-width="1">
    <line x1="20" y1="38" x2="230" y2="38"/><line x1="262" y1="38" x2="462" y2="38"/>
    <line x1="494" y1="38" x2="694" y2="38"/><line x1="724" y1="38" x2="962" y2="38"/>
    <line x1="20" y1="362" x2="528" y2="362"/><line x1="560" y1="362" x2="962" y2="362"/>
  </g>

  <!-- events -->
  <circle cx="44" cy="82" r="17" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
  <text x="74" y="78" font-size="13.5" font-weight="600" fill="#1F2D36">Départ</text>
  <text x="74" y="96" font-size="12" fill="#55636C">trait fin</text>
  <circle cx="44" cy="150" r="17" fill="#FFF8E1" stroke="#B7791F" stroke-width="1.4"/>
  <circle cx="44" cy="150" r="13" fill="none" stroke="#B7791F" stroke-width="1.4"/>
  <text x="74" y="146" font-size="13.5" font-weight="600" fill="#1F2D36">Intermédiaire</text>
  <text x="74" y="164" font-size="12" fill="#55636C">double trait</text>
  <circle cx="44" cy="218" r="17" fill="#FFEBEE" stroke="#C62828" stroke-width="4"/>
  <text x="74" y="214" font-size="13.5" font-weight="600" fill="#1F2D36">Fin</text>
  <text x="74" y="232" font-size="12" fill="#55636C">trait épais</text>
  <!-- message / timer start -->
  <circle cx="44" cy="286" r="17" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.6"/>
  <rect x="35" y="279" width="18" height="13" fill="#fff" stroke="#2E7D32" stroke-width="1.2"/>
  <path d="M35,279 L44,287 L53,279" fill="none" stroke="#2E7D32" stroke-width="1.2"/>
  <text x="74" y="282" font-size="13.5" font-weight="600" fill="#1F2D36">Départ « message »</text>
  <text x="74" y="300" font-size="12" fill="#55636C">(ou temporel : horloge)</text>

  <!-- activities -->
  <rect x="262" y="58" width="110" height="50" rx="9" fill="#E6F2F7" stroke="#1A8FB0" stroke-width="1.6"/>
  <text x="317" y="88" text-anchor="middle" font-size="13.5" fill="#1F2D36">Tâche</text>
  <text x="262" y="128" font-size="12" fill="#55636C">opération élémentaire</text>
  <rect x="262" y="160" width="110" height="50" rx="9" fill="#E6F2F7" stroke="#1A8FB0" stroke-width="1.6"/>
  <text x="317" y="182" text-anchor="middle" font-size="12.5" fill="#1F2D36">Sous-processus</text>
  <rect x="309" y="194" width="14" height="13" fill="#fff" stroke="#1F2D36" stroke-width="1.1"/>
  <path d="M316,197 L316,204 M312.5,200.5 L319.5,200.5" stroke="#1F2D36" stroke-width="1.3"/>
  <text x="262" y="230" font-size="12" fill="#55636C">contient d'autres activités</text>

  <!-- gateways -->
  <g transform="translate(520,84)">
    <path d="M0,-22 L22,0 L0,22 L-22,0 z" fill="#FFF8E1" stroke="#B7791F" stroke-width="1.6"/>
    <path d="M-8,-8 L8,8 M8,-8 L-8,8" stroke="#1F2D36" stroke-width="2.6"/>
  </g>
  <text x="554" y="80" font-size="13.5" font-weight="600" fill="#1F2D36">Exclusive</text>
  <text x="554" y="98" font-size="12" fill="#55636C">un seul chemin</text>
  <text x="554" y="114" font-size="12" fill="#55636C">(selon une condition)</text>
  <g transform="translate(520,170)">
    <path d="M0,-22 L22,0 L0,22 L-22,0 z" fill="#FFF8E1" stroke="#B7791F" stroke-width="1.6"/>
    <path d="M0,-11 L0,11 M-11,0 L11,0" stroke="#1F2D36" stroke-width="2.8"/>
  </g>
  <text x="554" y="166" font-size="13.5" font-weight="600" fill="#1F2D36">Parallèle</text>
  <text x="554" y="184" font-size="12" fill="#55636C">tous les chemins</text>
  <text x="554" y="200" font-size="12" fill="#55636C">en parallèle</text>

  <!-- connectors -->
  <line x1="724" y1="76" x2="830" y2="76" stroke="#1F2D36" stroke-width="1.8" marker-end="url(#filled)"/>
  <text x="724" y="100" font-size="13.5" font-weight="600" fill="#1F2D36">Flux de séquence</text>
  <text x="724" y="118" font-size="12" fill="#55636C">ordre des tâches, dans une piscine</text>
  <line x1="728" y1="160" x2="830" y2="160" stroke="#1F2D36" stroke-width="1.5" stroke-dasharray="7 5" marker-start="url(#circ)" marker-end="url(#open)"/>
  <text x="724" y="184" font-size="13.5" font-weight="600" fill="#1F2D36">Flux de message</text>
  <text x="724" y="202" font-size="12" fill="#55636C">entre deux participants (piscines)</text>
  <line x1="724" y1="244" x2="830" y2="244" stroke="#1F2D36" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#thin)"/>
  <text x="724" y="268" font-size="13.5" font-weight="600" fill="#1F2D36">Association</text>
  <text x="724" y="286" font-size="12" fill="#55636C">relie un objet ou un texte à une tâche</text>

  <!-- pool and lanes -->
  <rect x="20" y="380" width="508" height="160" fill="#F7FBFC" stroke="#1F2D36" stroke-width="1.4"/>
  <line x1="52" y1="380" x2="52" y2="540" stroke="#1F2D36" stroke-width="1.4"/>
  <line x1="52" y1="460" x2="528" y2="460" stroke="#1F2D36" stroke-width="1.1"/>
  <line x1="80" y1="380" x2="80" y2="540" stroke="#1F2D36" stroke-width="1"/>
  <text transform="translate(41,460) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="#0B4F6C">Piscine = participant</text>
  <text transform="translate(70,420) rotate(-90)" text-anchor="middle" font-size="11" fill="#1F2D36">Couloir 1</text>
  <text transform="translate(70,500) rotate(-90)" text-anchor="middle" font-size="11" fill="#1F2D36">Couloir 2</text>
  <circle cx="112" cy="420" r="12" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="124" y1="420" x2="164" y2="420" stroke="#1F2D36" stroke-width="1.5" marker-end="url(#filled)"/>
  <rect x="166" y="402" width="92" height="36" rx="7" fill="#E6F2F7" stroke="#1A8FB0" stroke-width="1.4"/>
  <text x="212" y="424" text-anchor="middle" font-size="12" fill="#1F2D36">Tâche A</text>
  <path d="M258,420 L290,420 L290,500 L318,500" fill="none" stroke="#1F2D36" stroke-width="1.5" marker-end="url(#filled)"/>
  <rect x="320" y="482" width="92" height="36" rx="7" fill="#E6F2F7" stroke="#1A8FB0" stroke-width="1.4"/>
  <text x="366" y="504" text-anchor="middle" font-size="12" fill="#1F2D36">Tâche B</text>
  <line x1="412" y1="500" x2="458" y2="500" stroke="#1F2D36" stroke-width="1.5" marker-end="url(#filled)"/>
  <circle cx="472" cy="500" r="12" fill="#FFEBEE" stroke="#C62828" stroke-width="3.5"/>
  <text x="300" y="414" font-size="11" fill="#55636C">le flux peut changer</text>
  <text x="300" y="428" font-size="11" fill="#55636C">de couloir, pas de piscine</text>

  <!-- objects -->
  <g transform="translate(580,388)">
    <path d="M0,0 L30,0 L42,12 L42,52 L0,52 z" fill="#fff" stroke="#1F2D36" stroke-width="1.4"/>
    <path d="M30,0 L30,12 L42,12" fill="none" stroke="#1F2D36" stroke-width="1.2"/>
  </g>
  <text x="636" y="408" font-size="13.5" font-weight="600" fill="#1F2D36">Objet de données</text>
  <text x="636" y="426" font-size="12" fill="#55636C">donnée en entrée / sortie d'une tâche</text>
  <g transform="translate(580,462)">
    <path d="M0,8 L0,52 A21,8 0 0 0 42,52 L42,8" fill="#E6F2F7" stroke="#1F2D36" stroke-width="1.4"/>
    <ellipse cx="21" cy="8" rx="21" ry="8" fill="#fff" stroke="#1F2D36" stroke-width="1.4"/>
  </g>
  <text x="636" y="486" font-size="13.5" font-weight="600" fill="#1F2D36">Source de données</text>
  <text x="636" y="504" font-size="12" fill="#55636C">on y lit ou on y stocke (ex. : l'ERP)</text>
</svg>
</body></html>
